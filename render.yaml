services:
  - type: web
    name: nook-api
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run migration:run:prod && npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: aws-0-us-east-1.pooler.supabase.com
      - key: DB_PORT
        value: '5432'
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: postgres
      - key: DB_SSL
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
